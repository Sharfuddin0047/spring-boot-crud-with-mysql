apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: spring-app-ns

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
      - name: mysql
        image: mysql:8.0

        ports:
        - containerPort: 3306

        env:
        - name: MYSQL_DATABASE
          value: spring-boot-a5

        - name: MYSQL_ROOT_PASSWORD
          value: "Sharfu@8826"

        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql

      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
