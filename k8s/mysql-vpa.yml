apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler

metadata:
  name: mysql-vpa
  namespace: spring-app-ns

spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mysql

  updatePolicy:
    updateMode: "Off"

  resourcePolicy:
    containerPolicies:
      - containerName: mysql

        minAllowed:
          cpu: "100m"
          memory: "256Mi"

        maxAllowed:
          cpu: "2"
          memory: "2Gi"

        controlledResources:
          - cpu
          - memory
